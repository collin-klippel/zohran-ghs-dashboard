# Builds from source in CI. The data payload under public/data/ is committed, so
# the build needs nothing beyond this repo — see README, "How data gets in".
[build]
  command = "npm run build"
  publish = "dist"

# Vite content-hashes everything in assets/, so it is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Data files keep stable names across builds, so they must revalidate rather
# than be cached hard — otherwise a data refresh would not reach browsers.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
